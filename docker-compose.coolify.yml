---

# Coolify deployment: source code is baked into the image via
# production_build stage — no source volume mount required or used.
# Set DJANGO_ENV and all other app variables in Coolify's environment
# variable UI; no .env file is needed (AutoConfig falls back to process env).

x-base: &base
  image: "***REMOVED***:latest"
  build:
    target: production_build
    context: .
    dockerfile: ./docker/django/Dockerfile
    args:
      DJANGO_ENV: development
  restart: unless-stopped
  volumes:
    - django-media:/var/www/django/media
    - django-locale:/code/locale

services:
  web:
    <<: *base
    command: python -We -bb manage.py runserver 0.0.0.0:8099
    environment:
      LOGFIRE_SERVICE_NAME: ***REMOVED***-web
    ports:
      - "8099:8099"

  worker:
    <<: *base
    environment:
      LOGFIRE_SERVICE_NAME: ***REMOVED***-worker
    command: >-
      python -m taskiq worker server.common.broker:broker
      server.common.django_setup
      server.apps.main.tasks
      server.apps.assets.tasks
      server.apps.clips.tasks
      server.apps.pipelines.tasks
      server.apps.analytics.tasks

  scheduler:
    <<: *base
    environment:
      LOGFIRE_SERVICE_NAME: ***REMOVED***-scheduler
    command: python -m taskiq scheduler server.common.scheduler:scheduler

volumes:
  django-media:
  django-locale:
