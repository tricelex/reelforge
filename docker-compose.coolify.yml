volumes:
  coolify_***REMOVED***_data: {}
  coolify_***REMOVED***_data_backups: {}
  coolify_redis_data: {}

x-app: &app
  build:
    context: .
    dockerfile: ./compose/production/django/Dockerfile
  restart: unless-stopped
  depends_on:
    ***REMOVED***:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    # Django core
    - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
    - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL}
    - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
    # Set to False — Coolify terminates SSL at its own proxy
    - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT:-False}
    - DJANGO_SERVER_EMAIL=${DJANGO_SERVER_EMAIL}
    - DJANGO_ACCOUNT_ALLOW_REGISTRATION=${DJANGO_ACCOUNT_ALLOW_REGISTRATION:-False}
    # Workers
    - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    # Storage
    - DJANGO_GCP_STORAGE_BUCKET_NAME=${DJANGO_GCP_STORAGE_BUCKET_NAME}
    - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    # Email
    - MAILGUN_API_KEY=${MAILGUN_API_KEY}
    - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
    # Monitoring
    - SENTRY_DSN=${SENTRY_DSN}
    # Celery Flower auth (used by flower if you add it later)
    - CELERY_FLOWER_USER=${CELERY_FLOWER_USER}
    - CELERY_FLOWER_PASSWORD=${CELERY_FLOWER_PASSWORD}
    # Redis — internal service, hardcoded
    - REDIS_URL=redis://redis:6379/0
    # Postgres — host/port hardcoded to internal service; credentials from env
    - POSTGRES_HOST=***REMOVED***
    - POSTGRES_PORT=5432
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}


services:
  ***REMOVED***:
    build:
      context: .
      dockerfile: ./compose/production/***REMOVED***/Dockerfile
    image: ***REMOVED***_coolify_***REMOVED***
    restart: unless-stopped
    volumes:
      - coolify_***REMOVED***_data:/var/lib/***REMOVED***ql/18/docker
      - coolify_***REMOVED***_data_backups:/backups
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: docker.io/redis:7.2
    restart: unless-stopped
    volumes:
      - coolify_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  django:
    <<: *app
    image: ***REMOVED***_coolify_django
    ports:
      - "5000:5000"
    command: /start
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celeryworker:
    <<: *app
    image: ***REMOVED***_coolify_django
    command: /start-celeryworker
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery_app inspect ping --timeout 10 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
