# Web service config.
# Scheduler: point to railway.scheduler.toml in Railway dashboard → Settings → Config File.
# Worker:    point to railway.worker.toml   in Railway dashboard → Settings → Config File.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/django/Dockerfile"
dockerBuildContext = "."

[deploy]
startCommand = "gunicorn --config /code/docker/django/gunicorn_config.py server.wsgi"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
