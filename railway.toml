[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/django/Dockerfile"
buildTarget = "production_build"
dockerBuildContext = "."

[deploy]
startCommand = "python -We -bb /code/manage.py runserver 0.0.0.0:8000"
healthcheckPath = "/health/?format=json"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
