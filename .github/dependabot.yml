version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directories:
      - '/'
    schedule:
      interval: 'daily'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'daily'
    ignore:
      - dependency-name: 'django'
        versions: ['6']
    groups:
      python:
        update-types:
          - 'minor'
          - 'patch'
