# Scheduler service config.
# Point to this file in Railway dashboard → scheduler service → Settings → Config File.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/django/Dockerfile"
dockerBuildContext = "."

[deploy]
startCommand = "python -m taskiq scheduler server.common.scheduler:scheduler"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
