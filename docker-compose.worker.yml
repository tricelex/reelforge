---

# Worker compose file — uses the ML image (torch CPU / mediapipe / pyannote / scenedetect).
# Run alongside dev: docker compose -f docker-compose.yml -f docker-compose.worker.yml up

services:
  worker:
    image: "reelforge:worker"
    # mediapipe publishes manylinux x86_64 wheels only — force amd64 on
    # Apple Silicon dev machines and match typical VPS targets.
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/worker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      LOGFIRE_SERVICE_NAME: reelforge-worker
      DIARIZATION_PRELOAD: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_NUM_THREADS: "4"
      HF_HOME: /var/cache/huggingface
      HUGGINGFACE_HUB_CACHE: /var/cache/huggingface/hub
    env_file: ./config/.env
    volumes:
      - .:/code
      - huggingface-cache:/var/cache/huggingface
    command: >-
      python -m taskiq worker server.common.broker:broker
      server.common.django_setup
      server.apps.main.tasks
      server.apps.assets.tasks
      server.apps.clips.tasks
      server.apps.pipelines.tasks
      server.apps.analytics.tasks

volumes:
  huggingface-cache:
