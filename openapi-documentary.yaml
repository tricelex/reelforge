      properties:
        start_sec:
          type: number
      required:
      - start_sec
      title: TranscriptChapterPayload
      type: object
    TranscriptPayload:
      description: Transcript data from clip_transcribe stage output.
      example:
        asset_id: GUJJdFlzesdAhsHeafxd
        chapters:
        - start_sec: 426412.350243686
        source_asset_url: rMKzHNJbSXpIKItHSOrH
        words:
        - end: 2.623818163559
          speaker_id: VUvtAUwXhhXNwGSYFLUo
          start: -503513.142641171
          word: midQdVLzOAzclZIWeSJw
      properties:
        asset_id:
          anyOf:
          - type: string
          - type: 'null'
        chapters:
          items:
            $ref: '#/components/schemas/TranscriptChapterPayload'
          type: array
        source_asset_url:
          anyOf:
          - type: string
          - type: 'null'
        words:
          items:
            $ref: '#/components/schemas/TranscriptWordPayload'
          type: array
      required:
      - asset_id
      - source_asset_url
      - words
      - chapters
      title: TranscriptPayload
      type: object
    TranscriptWordPayload:
      description: One word in a clip transcript.
      properties:
        end:
          type: number
        speaker_id:
          type: string
        start:
          type: number
        word:
          type: string
      required:
      - word
      - start
      - end
      - speaker_id
      title: TranscriptWordPayload
      type: object
    UserMePayload:
      description: Authenticated user summary.
      example:
        id: 7820
        role: GGkFTTHdwecnxNGoKAAn
        username: hEVjsekkeZUyMKBwICns
      properties:
        id:
          type: integer
        role:
          type: string
        username:
          type: string
      required:
      - id
      - username
      - role
      title: UserMePayload
      type: object
    YouTubeCallbackPayload:
      description: OAuth callback body.
      example:
        code: IkwwennNNCZRvnjGhvmt
        redirect_uri: GvJktyMzzDMljwHnpZPE
      properties:
        code:
          type: string
        redirect_uri:
          type: string
      required:
      - code
      - redirect_uri
      title: YouTubeCallbackPayload
      type: object
    YouTubeConnectPayload:
      description: OAuth authorization URL for YouTube connect.
      example:
        authorization_url: FpohWLgsAVcRNRJCgcFp
      properties:
        authorization_url:
          type: string
      required:
      - authorization_url
      title: YouTubeConnectPayload
      type: object
    YouTubeConnectResultPayload:
      description: Result of completing YouTube OAuth.
      example:
        connected: true
        scope: SzwqFflzhZbzmkJQOiPb
      properties:
        connected:
          type: boolean
        scope:
          type: string
      required:
      - connected
      - scope
      title: YouTubeConnectResultPayload
      type: object
    YouTubeStatusPayload:
      description: YouTube connection status (no secrets).
      example:
        connected: true
        scope: DTYgKCpyDAAnEqfnucEG
        token_expiry: dhMsITrjZrchTnpEmqGe
      properties:
        connected:
          type: boolean
        scope:
          anyOf:
          - type: string
          - type: 'null'
        token_expiry:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - connected
      title: YouTubeStatusPayload
      type: object
    _RejectPayload:
      example:
        reason: bEtbsQDJiGvUeGZwEfKp
      properties:
        reason:
          default: ''
          type: string
      title: _RejectPayload
      type: object
  securitySchemes:
    jwt:
      bearerFormat: JWT
      description: JWT token auth
      scheme: Bearer
      type: http
