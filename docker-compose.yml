---

# Development compose file.
# Run with: docker compose up
# Automatically loads `docker-compose.override.yml` if it exists.
#
# Only web and scheduler services are here.
# Worker uses a different image (ML libs) — see docker-compose.worker.yml.

services:
  web:
    <<: &web
      image: "***REMOVED***:dev"
      build:
        context: .
        dockerfile: ./docker/django/Dockerfile
        args:
          DJANGO_ENV: development
          UID: ${UID:-1000}
          GID: ${GID:-1000}
        cache_from:
          - "***REMOVED***:dev"
          - "***REMOVED***:latest"
      environment:
        DJANGO_ENV: development
        ASSET_CACHE_DIR: /tmp/***REMOVED***/assets
      volumes:
        - .:/code
        - source-cache:/tmp/***REMOVED***/assets
      env_file: ./config/.env
      depends_on:
        db:
          condition: service_healthy

    command: python -We -bb manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_ENV: development
      LOGFIRE_SERVICE_NAME: ***REMOVED***-web
      ASSET_CACHE_DIR: /tmp/***REMOVED***/assets
    healthcheck:
      test: /bin/sh /code/docker/django/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    expose:
      - "8000"

  scheduler:
    <<: *web
    command: python -m taskiq scheduler server.common.scheduler:scheduler
    environment:
      DJANGO_ENV: development
      LOGFIRE_SERVICE_NAME: ***REMOVED***-scheduler
      ASSET_CACHE_DIR: /tmp/***REMOVED***/assets

  # Local PostgreSQL — used ONLY for running the test suite fast.
  # The app itself (web/scheduler/worker) connects to the remote DB via
  # config/.env; tests override the DB host to `db` (see tests/conftest.py).
  # Data lives in tmpfs (RAM) so it is fast and wiped on restart.
  db:
    image: ***REMOVED***:16-alpine
    environment:
      POSTGRES_DB: ***REMOVED***_test
      POSTGRES_USER: ***REMOVED***
      POSTGRES_PASSWORD: ***REMOVED***
    tmpfs:
      - /var/lib/***REMOVED***ql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ***REMOVED*** -d ***REMOVED***_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "5432"

volumes:
  source-cache:
