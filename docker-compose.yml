---

# Development compose file.
# Run with: docker compose up
# Automatically loads `docker-compose.override.yml` if it exists.
#
# Only web and scheduler services are here.
# Worker uses a different image (ML libs) — see docker-compose.worker.yml.

services:
  web:
    <<: &web
      image: "reelforge:dev"
      build:
        context: .
        dockerfile: ./docker/django/Dockerfile
        args:
          DJANGO_ENV: development
          UID: ${UID:-1000}
          GID: ${GID:-1000}
        cache_from:
          - "reelforge:dev"
          - "reelforge:latest"
      environment:
        DJANGO_ENV: development
      volumes:
        - .:/code
      env_file: ./config/.env

    command: python -We -bb manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_ENV: development
      LOGFIRE_SERVICE_NAME: reelforge-web
    healthcheck:
      test: /bin/sh /code/docker/django/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    expose:
      - "8000"

  scheduler:
    <<: *web
    command: python -m taskiq scheduler server.common.scheduler:scheduler
    environment:
      DJANGO_ENV: development
      LOGFIRE_SERVICE_NAME: reelforge-scheduler
