x-app: &app
  build:
    context: .
    dockerfile: compose/production/django/Dockerfile
  restart: unless-stopped
  environment:
    - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.production}
    - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL}
    - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
    - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT:-False}
    - DJANGO_SERVER_EMAIL=${DJANGO_SERVER_EMAIL}
    - DJANGO_ACCOUNT_ALLOW_REGISTRATION=${DJANGO_ACCOUNT_ALLOW_REGISTRATION:-False}
    - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    - DATABASE_URL=${DATABASE_URL}
    - REDIS_URL=${REDIS_URL}
    - RUSTFS_ENDPOINT_URL=${RUSTFS_ENDPOINT_URL}
    - RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY_ID}
    - RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_ACCESS_KEY}
    - RUSTFS_BUCKET_NAME=${RUSTFS_BUCKET_NAME}
    - RUSTFS_REGION=${RUSTFS_REGION:-us-east-1}
    - MAILGUN_API_KEY=${MAILGUN_API_KEY}
    - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
    - SENTRY_DSN=${SENTRY_DSN}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    - FAL_KEY=${FAL_KEY}
    - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}

services:
  django:
    <<: *app
    ports:
      - "5000:5000"
    command: /start

  celeryworker:
    <<: *app
    command: /start-celeryworker
