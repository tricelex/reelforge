---

# Default compose file for development and production.
# Should be used directly in development.
# Automatically loads `docker-compose.override.yml` if it exists.
# No extra steps required.
# Should be used together with `docker/docker-compose.prod.yml`
# in production.

services:
  web:
    <<: &web
      # Image name is changed in production:
      image: "***REMOVED***:dev"
      build:
        target: development_build
        context: .
        dockerfile: ./docker/django/Dockerfile
        args:
          DJANGO_ENV: development
        cache_from:
          - "***REMOVED***:dev"
          - "***REMOVED***:latest"

      volumes:
        - django-static:/var/www/django/static
      networks:
        - backend-net
      env_file: ./config/.env

    command: python -We -bb manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: /bin/sh /code/docker/django/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *web
    command: >-
      python -m taskiq worker server.common.broker:broker
      server.common.django_setup
      server.apps.main.tasks
      server.apps.assets.tasks
      server.apps.clips.tasks
      server.apps.pipelines.tasks
      server.apps.analytics.tasks

  scheduler:
    <<: *web
    command: python -m taskiq scheduler server.common.scheduler:scheduler

networks:
  backend-net:

volumes:
  django-static:
