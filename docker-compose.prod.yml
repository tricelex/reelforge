---

# Local production-mode compose file — mirrors docker-compose.yml but runs
# gunicorn with DJANGO_ENV=production so you can test the production config locally.
#
# Run with: docker compose -f docker-compose.prod.yml up
#
# Only web and scheduler services are here.
# Worker uses a different image (ML libs) — see docker-compose.worker.yml.

services:
  web:
    <<: &web
      image: "reelforge:prod"
      build:
        context: .
        dockerfile: ./docker/django/Dockerfile
        args:
          DJANGO_ENV: production
          UID: ${UID:-1000}
          GID: ${GID:-1000}
      environment:
        DJANGO_ENV: production
      env_file: ./config/.env

    command: gunicorn --config /code/docker/django/gunicorn_config.py server.wsgi
    healthcheck:
      test: /bin/sh /code/docker/django/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    expose:
      - "8000"

  scheduler:
    <<: *web
    command: python -m taskiq scheduler server.common.scheduler:scheduler
