# Worker service config.
# Point to this file in Railway dashboard → worker service → Settings → Config File.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/worker/Dockerfile"
dockerBuildContext = "."

[deploy]
startCommand = "python -m taskiq worker server.common.broker:broker server.common.django_setup server.apps.main.tasks server.apps.assets.tasks server.apps.clips.tasks server.apps.pipelines.tasks server.apps.analytics.tasks"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
